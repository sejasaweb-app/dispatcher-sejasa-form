        <div class="card" style="margin-top:12px;">
          <div class="dash-card-title">Aktivitas Terbaru</div>
          <div class="activity-list">${activityRows}</div>
        </div>
      `;
    }

    const pendingHeader = '<div class="page-header"><h1>Menunggu Approval</h1><p>Pengajuan izin mitra yang belum diproses.</p></div>';

    function renderPendingRows(rows) {
      const el = document.getElementById('pendingTab');
      if (!rows.length) {
        el.innerHTML = pendingHeader + '<div class="card empty">Tidak ada pengajuan yang menunggu approval 🎉</div>';
        return;
      }
      el.innerHTML = pendingHeader + rows.map(r => `
        <div class="card req-card">
          <div class="avatar">${initials(r.nama)}</div>
          <div class="body">
            <div class="card-top">
              <div>
                <span class="name">${r.nama}</span>
                <span class="badge ${badgeClass(r.kategori)}">${r.kategori}</span>
              </div>
              <div class="meta" style="white-space:nowrap;">${fmtDate(r.timestampSubmit)}</div>
            </div>
            <div class="meta">${fmtDate(r.tanggalMulai)} – ${fmtDate(r.tanggalSelesai)} · ${r.jumlahHari} hari</div>
            <div class="meta">${r.keterangan || '-'}</div>
            ${r.linkLampiran ? `<div style="margin-top:8px;"><a class="lampiran" href="${r.linkLampiran}" target="_blank">Lihat Lampiran →</a></div>` : ''}
            <div class="actions">
              <button class="approve" onclick="process(${r.rowIndex}, 'approve')">Approve</button>
              <button class="reject" onclick="openRejectModal(${r.rowIndex}, '${escapeAttr(r.nama).replace(/'/g, "\\'")}')">Reject</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function loadPending() {
      const el = document.getElementById('pendingTab');
      el.innerHTML = pendingHeader + '<div class="card empty">Memuat...</div>';
      callApi('getPendingIzin', [TOKEN])
        .then(function(rows) {
          if (rows && rows.success === false) throw new Error(rows.message);
          renderPendingRows(rows);
        })
        .catch(function(err) { el.innerHTML = pendingHeader + '<div class="card empty">' + err.message + '</div>'; });
    }

    function process(rowIndex, action, catatan) {
      callApi('processIzin', [TOKEN, rowIndex, action, catatan || ''])
        .then(function(res) {
          if (res && res.success === false) throw new Error(res.message);
          showToast(action === 'approve' ? 'Pengajuan disetujui.' : 'Pengajuan ditolak.', 'success');
          loadPending();
        })
        .catch(function(err) { showToast('Gagal: ' + err.message, 'error'); });
    }

    // Modal alasan reject (ganti prompt() browser biar konsisten sama tampilan lain)
    function openRejectModal(rowIndex, nama) {
      const box = document.getElementById('mitraModalBox');
      box.innerHTML = `
        <h2>Tolak Pengajuan</h2>
        <p class="modal-sub">Tolak pengajuan izin dari <b>${nama}</b>. Alasan bersifat opsional, tapi membantu mitra memahami keputusan ini.</p>
        <label>Alasan (opsional)</label>
        <textarea class="reject-reason" id="rejectReasonInput" placeholder="Contoh: tanggal bentrok dengan jadwal kerja..."></textarea>
        <div class="modal-actions">
          <button class="btn-secondary" style="flex:1;" onclick="closeMitraModal()">Batal</button>
          <button class="btn-primary" style="margin-top:0;background:linear-gradient(135deg, var(--danger), #a8352c);" onclick="confirmRejectModal(${rowIndex})">Tolak Pengajuan</button>
        </div>
      `;
      document.getElementById('mitraModalOverlay').style.display = 'flex';
    }

    function confirmRejectModal(rowIndex) {
      const catatan = document.getElementById('rejectReasonInput').value.trim();
      closeMitraModal();
      process(rowIndex, 'reject', catatan);
    }

    const riwayatHeader = '<div class="page-header"><h1>Riwayat</h1><p>Pengajuan izin yang sudah diproses (Approved / Rejected).</p></div>';
    let riwayatCache = [];

    function loadRiwayat() {
      const el = document.getElementById('riwayatTab');
      el.innerHTML = riwayatHeader + '<div class="card empty">Memuat...</div>';
      callApi('getRiwayatIzin', [TOKEN])
        .then(function(rows) {
          if (rows && rows.success === false) throw new Error(rows.message);
          riwayatCache = rows;
          renderRiwayatTab();
        })
        .catch(function(err) { el.innerHTML = riwayatHeader + '<div class="card empty">' + err.message + '</div>'; });
    }

    function renderRiwayatTab() {
      const el = document.getElementById('riwayatTab');
      if (!riwayatCache.length) {
        el.innerHTML = riwayatHeader + '<div class="card empty">Belum ada riwayat.</div>';
        return;
      }
      el.innerHTML = riwayatHeader + `
        <div class="search-bar">
          <input type="text" id="riwayatSearch" placeholder="Cari nama mitra..." oninput="renderRiwayatRows()">
          <select id="riwayatFilterStatus" onchange="renderRiwayatRows()">
            <option value="">Semua Status</option>
            <option value="Approved">Approved</option>
            <option value="Rejected">Rejected</option>
          </select>
        </div>
        <div class="card" style="padding:0;overflow-x:auto;">
          <table id="riwayatTable" style="margin:0;"></table>
        </div>
      `;
      renderRiwayatRows();
    }

    function renderRiwayatRows() {
      const searchEl = document.getElementById('riwayatSearch');
      const filterEl = document.getElementById('riwayatFilterStatus');
      const q = searchEl ? searchEl.value.trim().toLowerCase() : '';
      const filterStatus = filterEl ? filterEl.value : '';

      const filtered = riwayatCache.filter(r => {
        const matchName = !q || r.nama.toLowerCase().indexOf(q) !== -1;
        const matchStatus = !filterStatus || r.status === filterStatus;
        return matchName && matchStatus;
      });

      const rowsHtml = filtered.map(r => `
        <tr>
          <td style="display:flex;align-items:center;gap:8px;">
            <div class="avatar" style="width:28px;height:28px;border-radius:8px;font-size:11px;">${initials(r.nama)}</div>
            ${r.nama}
          </td>
          <td>${r.kategori}</td>
          <td>${fmtDate(r.tanggalMulai)} – ${fmtDate(r.tanggalSelesai)}</td>
          <td><span class="status-pill ${r.status}">${r.status}</span></td>
          <td>${r.diprosesOleh || '-'}</td>
          <td class="riwayat-actions">
            <button class="icon-btn danger" title="Hapus (mitra bisa isi ulang)" onclick="confirmDeleteIzin('${r.id}', '${escapeAttr(r.nama).replace(/'/g, "\\'")}')">🗑️</button>
          </td>
        </tr>
      `).join('');

      document.getElementById('riwayatTable').innerHTML =
        '<tr><th>Mitra</th><th>Kategori</th><th>Tanggal</th><th>Status</th><th>Diproses Oleh</th><th></th></tr>' +
        (rowsHtml || '<tr><td colspan="6" class="empty">Tidak ada riwayat yang cocok.</td></tr>');
    }

    function confirmDeleteIzin(id, nama) {
      if (!confirm('Hapus riwayat izin "' + nama + '"? Mitra bisa mengisi ulang pengajuan ini dari awal. Tindakan ini tidak bisa dibatalkan.')) return;
      callApi('hapusIzin', [TOKEN, id])
        .then(function(res) {
          if (!res.success) { showToast(res.message, 'error'); return; }
          riwayatCache = riwayatCache.filter(r => r.id !== id);
          renderRiwayatTab();
          showToast('Riwayat izin berhasil dihapus.', 'success');
        })
        .catch(function(err) { showToast('Gagal menghapus: ' + err.message, 'error'); });
    }

    const laporanHeader = '<div class="page-header"><h1>Laporan</h1><p>Rekap izin yang disetujui per periode.</p></div>';

    function loadLaporan(periode, customFrom, customTo) {
      const el = document.getElementById('laporanTab');

      // Kalau baru pindah ke mode custom & belum pilih tanggal, tampilin
      // picker-nya dulu tanpa langsung fetch data.
      if (periode === 'custom' && (!customFrom || !customTo)) {
        el.innerHTML = laporanHeader + periodToggleHtml(periode) + customRangeHtml('', '');
        initCustomRangePicker();
        return;
      }

      el.innerHTML = laporanHeader + '<div class="card empty">Memuat...</div>';
      callApi('getLaporan', [TOKEN, periode, customFrom, customTo])
        .then(function(data) {
          if (!data.success) {
            el.innerHTML = laporanHeader + periodToggleHtml(periode) +
              (periode === 'custom' ? customRangeHtml(customFrom, customTo) : '') +
              '<div class="card empty">' + data.message + '</div>';
            if (periode === 'custom') initCustomRangePicker();
            return;
          }

          const kategoriRows = Object.keys(data.byKategori)
            .map(k => `<tr><td>${k}</td><td>${data.byKategori[k]}</td></tr>`).join('');
          const topMitraRows = data.topMitra.slice(0, 10)
            .map(m => `<tr>
              <td style="display:flex;align-items:center;gap:8px;">
                <div class="avatar" style="width:28px;height:28px;border-radius:8px;font-size:11px;">${initials(m.nama)}</div>
                ${m.nama}
              </td>
              <td>${m.totalHari} hari</td>
            </tr>`).join('');

          let periodLabel = '30 hari terakhir';
          if (periode === 'today') periodLabel = 'hari ini';
          if (periode === 'weekly') periodLabel = '7 hari terakhir';
          if (periode === 'custom') periodLabel = fmtDate(data.customFrom) + ' – ' + fmtDate(data.customTo);

          el.innerHTML = laporanHeader + periodToggleHtml(periode) +
            (periode === 'custom' ? customRangeHtml(data.customFrom, data.customTo) : '') + `
            <div class="stat-grid">
              <div class="stat-box">
                <div class="num">${data.totalPengajuan}</div>
                <div class="label">Total izin disetujui (${periodLabel})</div>
              </div>
            </div>
            <div class="card" style="margin-top:16px;">
              <b style="font-family:'Plus Jakarta Sans',sans-serif;">Breakdown per Kategori</b>
              <table><tr><th>Kategori</th><th>Jumlah</th></tr>${kategoriRows || '<tr><td colspan=2 class="empty">Belum ada data</td></tr>'}</table>
            </div>
            <div class="card">
              <b style="font-family:'Plus Jakarta Sans',sans-serif;">Mitra dengan Izin Terbanyak</b>
              <table><tr><th>Nama</th><th>Total Hari Izin</th></tr>${topMitraRows || '<tr><td colspan=2 class="empty">Belum ada data</td></tr>'}</table>
            </div>
          `;
          if (periode === 'custom') initCustomRangePicker();
        })
        .catch(function(err) { el.innerHTML = laporanHeader + periodToggleHtml(periode) + '<div class="card empty">' + err.message + '</div>'; });
    }

    function periodToggleHtml(periode) {
      return `
        <div class="period-toggle">
          <button class="${periode === 'today' ? 'on' : 'off'}" onclick="loadLaporan('today')">Hari Ini</button>
          <button class="${periode === 'weekly' ? 'on' : 'off'}" onclick="loadLaporan('weekly')">7 Hari</button>
          <button class="${periode === 'monthly' ? 'on' : 'off'}" onclick="loadLaporan('monthly')">30 Hari</button>
          <button class="${periode === 'custom' ? 'on' : 'off'}" onclick="loadLaporan('custom')">Custom</button>
        </div>
      `;
    }

    function customRangeHtml(from, to) {
      const hasRange = from && to;
      const label = hasRange ? (fmtDate(from) + ' – ' + fmtDate(to)) : 'Pilih rentang tanggal';
      return `
        <div class="custom-range-card">
          <div class="date-range-trigger${hasRange ? '' : ' empty'}" id="laporanRangeTrigger">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M3 8h14M7 2v3M13 2v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span id="laporanRangeLabel">${label}</span>
            <input type="text" id="laporanRangeInput" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;" readonly>
          </div>
        </div>
      `;
    }

    function initCustomRangePicker() {
      const trigger = document.getElementById('laporanRangeTrigger');
      const input = document.getElementById('laporanRangeInput');
      if (!trigger || !input) return;

      const fp = flatpickr(input, {
        mode: 'range',
        dateFormat: 'Y-m-d',
        disableMobile: true,
        showMonths: 2,
        onClose: function(selectedDates, dateStr, instance) {
          if (selectedDates.length === 2) {
            const toStr = (d) => formatLocalDate_(d);
            loadLaporan('custom', toStr(selectedDates[0]), toStr(selectedDates[1]));
          }
        }
      });
      trigger.addEventListener('click', function() { fp.open(); });
    }

    // Flatpickr ngasih objek Date lokal browser -- format manual ke YYYY-MM-DD
    // (bukan pakai toISOString, biar gak kegeser timezone).
    function formatLocalDate_(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    // ================= DATA MITRA =================

    let dataMitraCache = [];
    let kategoriWilayahMap = {};
    let kotaKecamatanMap = {};
    const HARI_OPTIONS = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];

    function escapeAttr(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function badgeClassKategori(k) {
      return (k || '').replace(/\s+/g, '-');
    }

    function loadDataMitra() {
      const el = document.getElementById('datamitraTab');
      el.innerHTML = datamitraHeader + '<div class="card empty">Memuat...</div>';
      callApi('getDataMitraInitData', [TOKEN])
        .then(function(data) {
          if (data && data.success === false) throw new Error(data.message);
          kategoriWilayahMap = data.kategoriWilayah;
          kotaKecamatanMap = data.kotaKecamatan;
          dataMitraCache = data.mitraList;
          renderDataMitraTab();
        })
        .catch(function(err) { el.innerHTML = datamitraHeader + '<div class="card empty">' + err.message + '</div>'; });
    }

    const datamitraHeader = '<div class="page-header"><h1>Data Mitra</h1><p>Profil mitra aktif: kontak, wilayah kerja, dan hari libur.</p></div>';

    // Region "Jabodetabek" gabungan dari beberapa kota -- kota lain (Surabaya,
    // Bandung, dst) ditampilkan apa adanya sebagai region sendiri.
    const JABODETABEK_SET_ = new Set(['Jakarta Barat', 'Jakarta Timur', 'Jakarta Pusat', 'Jakarta Utara', 'Jakarta Selatan', 'Bekasi', 'Depok', 'Tangerang', 'Tangerang Selatan', 'Bogor']);
    function regionOfKota_(kota) { return JABODETABEK_SET_.has(kota) ? 'Jabodetabek' : kota; }

    function renderDataMitraStats() {
      const total = dataMitraCache.length;
      const lakiCount = dataMitraCache.filter(m => m.gender === 'Laki-laki').length;
      const perempuanCount = dataMitraCache.filter(m => m.gender === 'Perempuan').length;

      // Breakdown kategori -- selalu tampilkan semua kategori yang ada di
      // config (termasuk yang masih 0 mitra, misal "Massage" yang baru mau jalan).
      const byKategori = {};
      Object.keys(kategoriWilayahMap).forEach(k => { byKategori[k] = 0; });
      dataMitraCache.forEach(m => { byKategori[m.kategori] = (byKategori[m.kategori] || 0) + 1; });

      // Breakdown wilayah -- kelompokkan semua kota Jabodetabek jadi satu,
      // kota lain (Surabaya, Bandung) berdiri sendiri. Satu mitra bisa
      // kehitung di lebih dari 1 region kalau wilayah kerjanya lintas region.
      const allKota = Object.keys(kotaKecamatanMap);
      const regionOrder = [];
      allKota.forEach(k => { const r = regionOfKota_(k); if (regionOrder.indexOf(r) === -1) regionOrder.push(r); });
      regionOrder.sort((a, b) => a === 'Jabodetabek' ? -1 : b === 'Jabodetabek' ? 1 : a.localeCompare(b));
      const byRegion = {};
      regionOrder.forEach(r => { byRegion[r] = 0; });
      dataMitraCache.forEach(m => {
        const regionsHit = new Set((m.kota || []).map(regionOfKota_));
        regionsHit.forEach(r => { if (byRegion[r] !== undefined) byRegion[r]++; });
      });

      const kategoriMax = Math.max(1, ...Object.values(byKategori));
      const kategoriBars = Object.keys(byKategori).map(k => `
        <div class="bar-row">
          <div class="bar-top"><span>${k}</span><span class="n">${byKategori[k]} mitra</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(byKategori[k] / kategoriMax * 100).toFixed(0)}%;"></div></div>
        </div>`).join('');

      const regionMax = Math.max(1, ...Object.values(byRegion));
      const regionBars = Object.keys(byRegion).length
        ? Object.keys(byRegion).map(r => `
          <div class="bar-row">
            <div class="bar-top"><span>${r}</span><span class="n">${byRegion[r]} mitra</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${(byRegion[r] / regionMax * 100).toFixed(0)}%;"></div></div>
          </div>`).join('')
        : '<div class="field-hint">Belum ada data wilayah.</div>';

      return `
        <div class="kpi-grid-3">
          <div class="kpi-card" style="--kpi-accent: var(--magenta-600); --kpi-accent-tint: var(--magenta-100);">
            <div class="kpi-top"><div class="kpi-icon"><svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="7.3" cy="6.5" r="2.3" stroke="currentColor" stroke-width="1.6"/><path d="M2.8 16c.5-2.8 2.3-4.3 4.5-4.3s4 1.5 4.5 4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="14" cy="6.8" r="1.8" stroke="currentColor" stroke-width="1.4"/><path d="M12.8 11.9c1.8.15 3.1 1.5 3.5 3.85" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></div></div>
            <div class="kpi-num">${total}</div>
            <div class="kpi-label">Total Mitra Aktif</div>
          </div>
          <div class="kpi-card" style="--kpi-accent: var(--blue); --kpi-accent-tint: #e6ecfb;">
            <div class="kpi-top"><div class="kpi-icon"><svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="6.5" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M4 17c.7-3.6 3-5.5 6-5.5s5.3 1.9 6 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div></div>
            <div class="kpi-num">${lakiCount}</div>
            <div class="kpi-label">Laki-laki</div>
          </div>
          <div class="kpi-card" style="--kpi-accent: var(--magenta-500); --kpi-accent-tint: var(--magenta-100);">
            <div class="kpi-top"><div class="kpi-icon"><svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="6.5" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M4 17c.7-3.6 3-5.5 6-5.5s5.3 1.9 6 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div></div>
            <div class="kpi-num">${perempuanCount}</div>
            <div class="kpi-label">Perempuan</div>
          </div>
        </div>
        <div class="dash-grid" style="margin-bottom:16px;">
          <div class="card">
            <div class="dash-card-title">Kategori Layanan</div>
            <div class="bar-chart">${kategoriBars}</div>
          </div>
          <div class="card">
            <div class="dash-card-title">Sebaran Wilayah</div>
            <div class="bar-chart">${regionBars}</div>
          </div>
        </div>
      `;
    }

    function renderDataMitraTab() {
      const el = document.getElementById('datamitraTab');
      const kategoriOptions = Object.keys(kategoriWilayahMap).map(k => `<option value="${k}">${k}</option>`).join('');
      el.innerHTML = datamitraHeader + renderDataMitraStats() + `
        <div class="toolbar">
          <div class="toolbar-actions">
            <button class="btn-primary" style="margin-top:0;" onclick="openMitraModal()">+ Tambah Mitra</button>
            <button class="btn-outline" onclick="openImportModal()">Upload CSV</button>
          </div>
          <div style="font-size:12.5px;color:var(--ink-600);">${dataMitraCache.length} mitra terdaftar</div>
        </div>
        <div class="search-bar">
          <input type="text" id="mitraSearch" placeholder="Cari nama mitra..." oninput="renderMitraRows()">
          <select id="mitraFilterKategori" onchange="renderMitraRows()">
            <option value="">Semua Kategori</option>
            ${kategoriOptions}
          </select>
        </div>
        <div class="card" style="padding:0;overflow-x:auto;">
          <table id="mitraTable" style="margin:0;"></table>
        </div>
      `;
      renderMitraRows();
    }

    function renderMitraRows() {
      const searchEl = document.getElementById('mitraSearch');
      const filterEl = document.getElementById('mitraFilterKategori');
      const q = searchEl ? searchEl.value.trim().toLowerCase() : '';
      const filterKategori = filterEl ? filterEl.value : '';

      const filtered = dataMitraCache.filter(m => {
        const matchName = !q || m.nama.toLowerCase().indexOf(q) !== -1;
        const matchKategori = !filterKategori || m.kategori === filterKategori;
        return matchName && matchKategori;
      });

      const rowsHtml = filtered.map(m => `
        <tr>
          <td style="display:flex;align-items:center;gap:8px;">
            <div class="avatar" style="width:30px;height:30px;border-radius:9px;font-size:11px;">${initials(m.nama)}</div>
            ${escapeAttr(m.nama)}
          </td>
          <td>${escapeAttr(m.telpon)}<br><span style="color:var(--ink-600);font-size:11.5px;">${escapeAttr(m.email)}</span></td>
          <td><span class="kategori-badge ${badgeClassKategori(m.kategori)}">${m.kategori}</span></td>
          <td>${m.kota.join(', ')}</td>
          <td>${m.hariLibur.join(', ') || '-'}</td>
          <td>${m.gender}</td>
          <td style="white-space:nowrap;">
            <button class="icon-btn" title="Edit" onclick="openMitraModal('${m.id}')">✏️</button>
            <button class="icon-btn danger" title="Hapus" onclick="confirmDeleteMitra('${m.id}', '${escapeAttr(m.nama).replace(/'/g, "\\'")}')">🗑️</button>
          </td>
        </tr>
      `).join('');

      document.getElementById('mitraTable').innerHTML =
        '<tr><th>Nama</th><th>Kontak</th><th>Kategori</th><th>Kota</th><th>Hari Libur</th><th>Gender</th><th></th></tr>' +
        (rowsHtml || `<tr><td colspan="7" class="empty">${dataMitraCache.length ? 'Tidak ada mitra yang cocok dengan pencarian.' : 'Belum ada data mitra. Klik "+ Tambah Mitra" atau "Upload CSV" untuk mulai.'}</td></tr>`);
    }

    // ---------- MODAL TAMBAH / EDIT MITRA ----------

    function openMitraModal(id) {
      const isEdit = !!id;
      const m = isEdit ? dataMitraCache.find(x => x.id === id) : null;
      const box = document.getElementById('mitraModalBox');

      const kategoriOptions = Object.keys(kategoriWilayahMap)
        .map(k => `<option value="${k}"${m && m.kategori === k ? ' selected' : ''}>${k}</option>`).join('');

      box.innerHTML = `
        <h2>${isEdit ? 'Edit Mitra' : 'Tambah Mitra Baru'}</h2>
        <p class="modal-sub">${isEdit ? 'Perbarui data mitra ' + escapeAttr(m.nama) + '.' : 'Isi data mitra yang aktif saat ini.'}</p>

        <label>Nama Mitra</label>
        <input type="text" id="mNama" value="${isEdit ? escapeAttr(m.nama) : ''}">

        <div class="row2">
          <div>
            <label>Nomor Telpon</label>
            <input type="text" id="mTelpon" value="${isEdit ? escapeAttr(m.telpon) : ''}" placeholder="08xxxxxxxxxx">
          </div>
          <div>
            <label>Email</label>
            <input type="email" id="mEmail" value="${isEdit ? escapeAttr(m.email) : ''}">
          </div>
        </div>

        <label>Password</label>
        <div class="password-field">
          <input type="password" id="mPassword" value="${isEdit ? escapeAttr(m.password) : ''}">
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility()">👁️</button>
        </div>
        <div class="field-hint">Dipakai mitra buat login ke aplikasi/portal mereka nantinya.</div>

        <label>Kategori Layanan</label>
        <select id="mKategori" onchange="onKategoriModalChange()">
          <option value="">Pilih kategori</option>
          ${kategoriOptions}
        </select>

        <label>Kota</label>
        <div class="kecamatan-dropdown" id="mKotaDropdownWrap">
          <button type="button" class="kecamatan-dropdown-btn" onclick="toggleKecamatanDropdown(this)">
            <span class="kota-select-label placeholder-text" id="mKotaLabel">Pilih kategori dulu</span>
            <svg class="chevron" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="kecamatan-dropdown-panel" id="mKotaPanel" style="display:none;"></div>
        </div>

        <label>Kecamatan</label>
        <div id="mKecamatanContainer"></div>
        <div class="field-hint">Kecamatan otomatis muncul sesuai kota yang dipilih di atas.</div>

        <label>Hari Libur</label>
        <div class="checkbox-grid" id="mHariGroup"></div>

        <label>Gender</label>
        <select id="mGender">
          <option value="">Pilih gender</option>
          <option value="Laki-laki"${m && m.gender === 'Laki-laki' ? ' selected' : ''}>Laki-laki</option>
          <option value="Perempuan"${m && m.gender === 'Perempuan' ? ' selected' : ''}>Perempuan</option>
        </select>

        <div class="modal-msg" id="mitraModalMsg"></div>
        <div class="modal-actions">
          <button class="btn-secondary" style="flex:1;" onclick="closeMitraModal()">Batal</button>
          <button class="btn-primary" style="margin-top:0;" id="mitraSaveBtn" onclick="saveMitraModal('${isEdit ? id : ''}')">${isEdit ? 'Simpan Perubahan' : 'Tambah Mitra'}</button>
        </div>
      `;

      document.getElementById('mitraModalOverlay').style.display = 'flex';
      window.kecamatanTags = m ? m.kecamatan.slice() : [];
      renderKotaCheckboxes(m ? m.kategori : '', m ? m.kota : []);
      renderHariCheckboxes(m ? m.hariLibur : []);
      renderKecamatanGroups();
    }

    function closeMitraModal() {
      document.getElementById('mitraModalOverlay').style.display = 'none';
      document.getElementById('mitraModalBox').innerHTML = '';
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('mPassword');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function onKategoriModalChange() {
      const kategori = document.getElementById('mKategori').value;
      window.kecamatanTags = [];
      renderKotaCheckboxes(kategori, []);
      renderKecamatanGroups();
    }

    function renderKotaCheckboxes(kategori, selectedKota) {
      const panel = document.getElementById('mKotaPanel');
      if (!kategori || !kategoriWilayahMap[kategori]) {
        panel.innerHTML = '<div class="field-hint" style="padding:6px 8px;">Pilih kategori dulu.</div>';
        setKotaLabel('Pilih kategori dulu', true);
        return;
      }
      const allowed = kategoriWilayahMap[kategori];
      panel.innerHTML = allowed.map(kota => {
        const checked = selectedKota && selectedKota.indexOf(kota) !== -1;
        return `<label class="dropdown-check-row">
          <input type="checkbox" value="${kota}" ${checked ? 'checked' : ''} onchange="onKotaCheckboxChange(this)"> ${kota}
        </label>`;
      }).join('');
      updateKotaLabel();
    }

    function setKotaLabel(text, isPlaceholder) {
      const labelEl = document.getElementById('mKotaLabel');
      labelEl.textContent = text;
      labelEl.classList.toggle('placeholder-text', !!isPlaceholder);
    }

    function updateKotaLabel() {
      const checked = Array.from(document.querySelectorAll('#mKotaPanel input:checked')).map(el => el.value);
      if (!checked.length) { setKotaLabel('Pilih kota', true); return; }
      const joined = checked.join(', ');
      setKotaLabel(joined.length > 42 ? checked.length + ' kota dipilih' : joined, false);
    }

    function onKotaCheckboxChange(el) {
      updateKotaLabel();
      if (!el.checked) {
        // kota di-uncheck -> buang kecamatan kota itu dari pilihan
        const kecList = kotaKecamatanMap[el.value] || [];
        window.kecamatanTags = window.kecamatanTags.filter(k => kecList.indexOf(k) === -1);
      }
      renderKecamatanGroups();
    }

    function renderKecamatanGroups() {
      const container = document.getElementById('mKecamatanContainer');
      const selectedKota = Array.from(document.querySelectorAll('#mKotaPanel input:checked')).map(el => el.value);

      if (!selectedKota.length) {
        container.innerHTML = '<div class="field-hint">Pilih kota dulu buat munculin daftar kecamatannya.</div>';
        return;
      }

      container.innerHTML = selectedKota.map(kota => {
        const list = kotaKecamatanMap[kota] || [];
        const selectedCount = list.filter(k => window.kecamatanTags.indexOf(k) !== -1).length;
        const rows = list.map(kec => {
          const checked = window.kecamatanTags.indexOf(kec) !== -1;
          return `<label class="dropdown-check-row">
            <input type="checkbox" value="${escapeAttr(kec)}" data-kota="${escapeAttr(kota)}" ${checked ? 'checked' : ''} onchange="onKecamatanCheckboxChange(this)"> ${kec}
          </label>`;
        }).join('');

        return `<div class="kecamatan-dropdown">
          <button type="button" class="kecamatan-dropdown-btn" onclick="toggleKecamatanDropdown(this)">
            <span class="kota-name">${kota}</span>
            <span class="kecamatan-dropdown-count" data-kota-count="${escapeAttr(kota)}">${selectedCount ? selectedCount + ' dipilih' : 'Pilih kecamatan'}</span>
            <svg class="chevron" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="kecamatan-dropdown-panel" style="display:none;">
            ${rows || '<div class="field-hint">Belum ada data kecamatan untuk kota ini.</div>'}
          </div>
        </div>`;
      }).join('');
    }

    function toggleKecamatanDropdown(btn) {
      const panel = btn.nextElementSibling;
      const willOpen = panel.style.display === 'none';
      document.querySelectorAll('.kecamatan-dropdown-panel').forEach(p => { p.style.display = 'none'; });
      document.querySelectorAll('.kecamatan-dropdown-btn').forEach(b => b.classList.remove('open'));
      if (willOpen) {
        panel.style.display = 'block';
        btn.classList.add('open');
      }
    }

    // Tutup dropdown yang lagi kebuka (kota atau kecamatan) kalau klik di luar area dropdown-nya
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.kecamatan-dropdown')) {
        document.querySelectorAll('.kecamatan-dropdown-panel').forEach(p => { p.style.display = 'none'; });
        document.querySelectorAll('.kecamatan-dropdown-btn').forEach(b => b.classList.remove('open'));
      }
    });

    function onKecamatanCheckboxChange(el) {
      el.parentElement.classList.toggle('checked', el.checked);
      const idx = window.kecamatanTags.indexOf(el.value);
      if (el.checked && idx === -1) window.kecamatanTags.push(el.value);
      if (!el.checked && idx !== -1) window.kecamatanTags.splice(idx, 1);

      const kota = el.dataset.kota;
      const list = kotaKecamatanMap[kota] || [];
      const count = list.filter(k => window.kecamatanTags.indexOf(k) !== -1).length;
      const countEl = document.querySelector('.kecamatan-dropdown-count[data-kota-count="' + kota.replace(/"/g, '\\"') + '"]');
      if (countEl) countEl.textContent = count ? count + ' dipilih' : 'Pilih kecamatan';
    }

    function renderHariCheckboxes(selected) {
      const group = document.getElementById('mHariGroup');
      group.innerHTML = HARI_OPTIONS.map(hari => {
        const checked = selected && selected.indexOf(hari) !== -1;
        return `<label class="checkbox-chip${checked ? ' checked' : ''}">
          <input type="checkbox" value="${hari}" ${checked ? 'checked' : ''} onchange="this.parentElement.classList.toggle('checked', this.checked)"> ${hari}
        </label>`;
      }).join('');
    }

    function saveMitraModal(id) {
      const nama = document.getElementById('mNama').value.trim();
      const telpon = document.getElementById('mTelpon').value.trim();
      const email = document.getElementById('mEmail').value.trim();
      const password = document.getElementById('mPassword').value;
      const kategori = document.getElementById('mKategori').value;
      const kota = Array.from(document.querySelectorAll('#mKotaPanel input:checked')).map(el => el.value);
      const kecamatan = window.kecamatanTags.slice();
      const hariLibur = Array.from(document.querySelectorAll('#mHariGroup input:checked')).map(el => el.value);
      const gender = document.getElementById('mGender').value;
      const msgEl = document.getElementById('mitraModalMsg');
      msgEl.textContent = '';

      if (!nama || !telpon || !email || !password || !kategori || !kota.length || !gender) {
        msgEl.textContent = 'Mohon lengkapi semua field wajib (Kecamatan boleh dikosongkan).';
        return;
      }

      const data = { nama, telpon, email, password, kategori, kota, kecamatan, hariLibur, gender };
      const btn = document.getElementById('mitraSaveBtn');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      function onDone(res) {
        btn.disabled = false;
        btn.textContent = id ? 'Simpan Perubahan' : 'Tambah Mitra';
        if (res.success) {
          applyMitraSaveLocally(id, data, res);
          closeMitraModal();
          showToast(id ? 'Data mitra berhasil diperbarui.' : 'Mitra baru berhasil ditambahkan.', 'success');
        } else {
          msgEl.textContent = res.message;
        }
      }
      function onFail(err) {
        btn.disabled = false;
        btn.textContent = id ? 'Simpan Perubahan' : 'Tambah Mitra';
        msgEl.textContent = 'Gagal menyimpan: ' + err.message;
      }

      const action = id ? 'updateDataMitra' : 'tambahDataMitra';
      const params = id ? [TOKEN, id, data] : [TOKEN, data];
      callApi(action, params).then(onDone).catch(onFail);
    }

    // Simpen di sisi server udah beres (ini dipanggil abis res.success true),
    // jadi tinggal update cache lokal pake data yang emang udah kita punya --
    // gak perlu fetch ulang ke server, jadi gak bisa macet gara-gara hiccup
    // jaringan pas reload kayak yang kemarin kejadian.
    function applyMitraSaveLocally(id, data, res) {
      if (id) {
        const idx = dataMitraCache.findIndex(m => m.id === id);
        if (idx !== -1) dataMitraCache[idx] = Object.assign({}, dataMitraCache[idx], data);
      } else {
        dataMitraCache.push(Object.assign({ id: res.id, tanggalDitambahkan: new Date() }, data));
      }
      dataMitraCache.sort((a, b) => a.nama.localeCompare(b.nama, 'id', { sensitivity: 'base' }));
      renderDataMitraTab();
    }

    function confirmDeleteMitra(id, nama) {
      if (!confirm('Hapus data mitra "' + nama + '"? Tindakan ini tidak bisa dibatalkan.')) return;
      callApi('hapusDataMitra', [TOKEN, id])
        .then(function(res) {
          if (res.success) {
            dataMitraCache = dataMitraCache.filter(m => m.id !== id);
            renderDataMitraTab();
            showToast('Data mitra berhasil dihapus.', 'success');
          } else {
            showToast(res.message, 'error');
          }
        })
        .catch(function(err) { showToast('Gagal menghapus: ' + err.message, 'error'); });
    }

    // ---------- UPLOAD CSV MASSAL ----------

    function downloadTemplateCsv() {
      const header = 'Nama Mitra,Nomor Telpon,Email,Password,Kategori,Kota,Kecamatan,Hari Libur,Gender';
      const example = 'Siti Aminah,081234567890,siti@example.com,rahasia123,Daily Cleaning,Surabaya;Bandung,Genteng;Coblong,Minggu,Perempuan';
      const csv = header + '\n' + example + '\n';
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'template-data-mitra.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function openImportModal() {
      const box = document.getElementById('mitraModalBox');
      box.innerHTML = `
        <h2>Upload Data Mitra (CSV)</h2>
        <p class="modal-sub">Kolom: Nama Mitra, Nomor Telpon, Email, Password, Kategori, Kota, Kecamatan, Hari Libur, Gender. Kalau kota/kecamatan/hari libur lebih dari satu, pisahkan pakai titik koma ( ; ) di dalam satu kolom.</p>
        <button type="button" class="btn-outline" style="width:auto;margin-bottom:14px;" onclick="downloadTemplateCsv()">⬇ Download Template CSV</button>
        <div class="dropzone" id="csvDropzone" onclick="document.getElementById('csvFileInput').click()">
          Klik untuk pilih file .csv, atau drag &amp; drop di sini
        </div>
        <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="handleCsvFileSelected(event)">
        <div id="csvPreviewArea"></div>
        <div class="modal-msg" id="importModalMsg"></div>
        <div class="modal-actions">
          <button class="btn-secondary" style="flex:1;" onclick="closeMitraModal()">Batal</button>
          <button class="btn-primary" style="margin-top:0;display:none;" id="importConfirmBtn" onclick="confirmImportCsv()">Import Sekarang</button>
        </div>
      `;
      document.getElementById('mitraModalOverlay').style.display = 'flex';
      window.parsedCsvRows = [];

      const dz = document.getElementById('csvDropzone');
      dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.style.borderColor = 'var(--magenta-500)'; });
      dz.addEventListener('dragleave', function() { dz.style.borderColor = ''; });
      dz.addEventListener('drop', function(e) {
        e.preventDefault();
        dz.style.borderColor = '';
        if (e.dataTransfer.files && e.dataTransfer.files[0]) readCsvFile(e.dataTransfer.files[0]);
      });
    }

    function handleCsvFileSelected(e) {
      const file = e.target.files[0];
      if (file) readCsvFile(file);
    }

    function readCsvFile(file) {
      const reader = new FileReader();
      reader.onload = function() { parseAndPreviewCsv(reader.result); };
      reader.readAsText(file);
    }

    function parseCsvLine_(line) {
      return line.split(',').map(function(cell) {
        let c = cell.trim();
        if (c.length > 1 && c.charAt(0) === '"' && c.charAt(c.length - 1) === '"') c = c.slice(1, -1);
        return c;
      });
    }

    function validateCsvRowClient_(data) {
      if (!data.nama) return 'Nama Mitra kosong.';
      if (!data.telpon) return 'Nomor Telpon kosong.';
      if (!data.email) return 'Email kosong.';
      if (!data.password) return 'Password kosong.';
      if (!kategoriWilayahMap[data.kategori]) return 'Kategori "' + data.kategori + '" tidak dikenal.';
      const allowed = kategoriWilayahMap[data.kategori];
      const validKota = data.kota.filter(function(k) { return allowed.indexOf(k) !== -1; });
      if (!validKota.length) return 'Kota tidak sesuai kategori (harus salah satu: ' + allowed.join(', ') + ').';
      if (data.gender !== 'Laki-laki' && data.gender !== 'Perempuan') return 'Gender harus "Laki-laki" atau "Perempuan".';
      return null;
    }

    function parseAndPreviewCsv(text) {
      const lines = text.split(/\r\n|\n|\r/).filter(function(l) { return l.trim().length > 0; });
      if (lines.length < 2) {
        document.getElementById('importModalMsg').textContent = 'File kosong atau cuma ada baris header.';
        return;
      }
      const dataLines = lines.slice(1); // baris pertama = header, di-skip
      const parsed = dataLines.map(function(line) {
        const cells = parseCsvLine_(line);
        return {
          nama: cells[0] || '',
          telpon: cells[1] || '',
          email: cells[2] || '',
          password: cells[3] || '',
          kategori: cells[4] || '',
          kota: (cells[5] || '').split(';').map(function(s) { return s.trim(); }).filter(Boolean),
          kecamatan: (cells[6] || '').split(';').map(function(s) { return s.trim(); }).filter(Boolean),
          hariLibur: (cells[7] || '').split(';').map(function(s) { return s.trim(); }).filter(Boolean),
          gender: cells[8] || ''
        };
      });

      window.parsedCsvRows = parsed.map(function(data) {
        return { data: data, error: validateCsvRowClient_(data) };
      });
      renderCsvPreview();
    }

    function renderCsvPreview() {
      const area = document.getElementById('csvPreviewArea');
      const rows = window.parsedCsvRows;
      const validCount = rows.filter(function(r) { return !r.error; }).length;

      const rowsHtml = rows.map(function(r, idx) {
        return `<tr class="${r.error ? 'row-invalid' : ''}">
          <td>${idx + 1}</td>
          <td>${escapeAttr(r.data.nama) || '-'}</td>
          <td>${escapeAttr(r.data.kategori) || '-'}</td>
          <td>${r.error ? escapeAttr(r.error) : 'OK'}</td>
        </tr>`;
      }).join('');

      area.innerHTML = `
        <div class="field-hint" style="margin:12px 0 6px;">${validCount} dari ${rows.length} baris valid dan siap diimport.</div>
        <div class="import-preview-table">
          <table>
            <tr><th>#</th><th>Nama</th><th>Kategori</th><th>Status</th></tr>
            ${rowsHtml}
          </table>
        </div>
      `;

      document.getElementById('importConfirmBtn').style.display = validCount ? 'block' : 'none';
    }

    function confirmImportCsv() {
      const validRows = window.parsedCsvRows.filter(function(r) { return !r.error; }).map(function(r) { return r.data; });
      if (!validRows.length) return;

      const btn = document.getElementById('importConfirmBtn');
      btn.disabled = true;
      btn.textContent = 'Mengimport...';

      callApi('importDataMitraBulk', [TOKEN, validRows])
        .then(function(res) {
          btn.disabled = false;
          btn.textContent = 'Import Sekarang';
          if (!res.success) {
            document.getElementById('importModalMsg').textContent = res.message;
            return;
          }
          if (res.failed && res.failed.length) {
            document.getElementById('importModalMsg').innerHTML =
              escapeAttr(res.message) + '<br><br>Detail baris gagal:<br>' +
              res.failed.map(function(f) { return '#' + f.row + ' ' + escapeAttr(f.nama || '') + ': ' + escapeAttr(f.message); }).join('<br>');
            loadDataMitra();
          } else {
            closeMitraModal();
            loadDataMitra();
            showToast(res.message, 'success');
          }
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = 'Import Sekarang';
          document.getElementById('importModalMsg').textContent = 'Gagal import: ' + err.message;
        });
    }

    // Coba pulihkan sesi login begitu halaman ini dibuka/di-refresh.
    tryRestoreSession();
  </script>
</body>
</html>
