    function periodeLabelJs_(periode) {
      const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const m = /^(\d{4})-(\d{2})-P([12])$/.exec(String(periode || ''));
      if (!m) return periode;
      const year = parseInt(m[1], 10), month = parseInt(m[2], 10), pnum = m[3];
      if (month < 1 || month > 12) return periode;
      if (pnum === '1') return 'Periode 1 (11-25 ' + BULAN[month - 1] + ' ' + year + ')';
      let nextMonth = month + 1, nextYear = year;
      if (nextMonth > 12) { nextMonth = 1; nextYear += 1; }
      return 'Periode 2 (26 ' + BULAN[month - 1] + ' - 10 ' + BULAN[nextMonth - 1] + ' ' + nextYear + ')';
    }
    function fmtRupiahJs_(n) {
      const num = Number(n) || 0;
      return 'Rp' + num.toLocaleString('id-ID');
    }
    function fmtJamJs_(n) {
      const num = Number(n) || 0;
      return (Number.isInteger(num) ? num.toLocaleString('id-ID') : num.toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 1 })) + ' Jam';
    }

    function updateGajiPreview_() {
      const pokok = Number(document.getElementById('gajiPokokInput').value) || 0;
      const pinalti = Number(document.getElementById('gajiPinaltiInput').value) || 0;
      const kompensasi = Number(document.getElementById('gajiKompensasiInput').value) || 0;
      const bonus = Number(document.getElementById('gajiBonusInput').value) || 0;
      const total = pokok - pinalti + kompensasi + bonus;
      document.getElementById('gajiPreviewTotal').textContent = fmtRupiahJs_(total);
    }

    // Pecah "YYYY-MM-P1"/"YYYY-MM-P2" jadi {bulan:'YYYY-MM', pnum:'P1'|'P2'}
    // buat ngisi ulang form edit.
    function splitPeriode_(periode) {
      const m = /^(\d{4}-\d{2})-P([12])$/.exec(String(periode || ''));
      if (!m) {
        const d = currentPeriodeDefault_();
        const dm = /^(\d{4}-\d{2})-P([12])$/.exec(d);
        return { bulan: dm[1], pnum: dm[2] === '1' ? 'P1' : 'P2' };
      }
      return { bulan: m[1], pnum: 'P' + m[2] };
    }

    function openGajiModal(id) {
      const isEdit = !!id;
      const g = isEdit ? gajiCache.find(x => x.id === id) : null;
      const box = document.getElementById('mitraModalBox');
      const namaOptions = gajiMitraNames_.map(n => `<option value="${n}" ${g && g.nama === n ? 'selected' : ''}>${n}</option>`).join('');
      const currentSplit = splitPeriode_(g ? g.periode : currentPeriodeDefault_());

      box.innerHTML = `

        <p class="modal-sub">Gaji Total dihitung otomatis: Gaji Pokok &minus; Pinalti + Kompensasi + Bonus.</p>
        <label>Nama Mitra</label>
        <select id="gajiNamaInput" ${isEdit ? 'disabled' : ''}>
          <option value="">Pilih mitra</option>

          </div>
        </div>
        <div class="field-hint">Periode 2 dihitung mulai tanggal 26 bulan yang dipilih sampai tanggal 10 bulan berikutnya.</div>
        <div class="row2">
          <div>
            <label>Durasi Kerja (jam)</label>
            <input type="number" id="gajiDurasiInput" min="0" step="0.5" value="${g ? g.durasiKerja : ''}" oninput="updateGajiPreview_()">
          </div>
          <div>
            <label>Gaji Pokok (Rp)</label>
            <input type="number" id="gajiPokokInput" min="0" value="${g ? g.gajiPokok : ''}" oninput="updateGajiPreview_()">
          </div>
        </div>
        <div class="row2">
          <div>
            <label>Pinalti (Rp)</label>
            <input type="number" id="gajiPinaltiInput" min="0" value="${g ? g.pinalti : 0}" oninput="updateGajiPreview_()">
          </div>
          <div>
            <label>Kompensasi (Rp)</label>
            <input type="number" id="gajiKompensasiInput" min="0" value="${g ? g.kompensasi : 0}" oninput="updateGajiPreview_()">
          </div>
        </div>
        <label>Bonus (Rp)</label>
        <input type="number" id="gajiBonusInput" min="0" value="${g ? g.bonus : 0}" oninput="updateGajiPreview_()">

        <div class="gaji-preview">
          <span>Gaji Total</span>
          <span id="gajiPreviewTotal">${fmtRupiahJs_(g ? g.gajiTotal : 0)}</span>
        </div>

        <div class="modal-msg" id="gajiModalMsg"></div>
        <div class="modal-actions">
          <button class="btn-secondary" style="flex:1;" onclick="closeMitraModal()">Batal</button>

    function saveGajiModal(id) {
      const isEdit = !!id;
      const g = isEdit ? gajiCache.find(x => x.id === id) : null;
      const msgEl = document.getElementById('gajiModalMsg');
      msgEl.textContent = '';

      const bulanVal = document.getElementById('gajiPeriodeBulanInput').value;
      const pnumVal = document.getElementById('gajiPeriodeNomorInput').value;
      const data = {
        nama: isEdit ? g.nama : document.getElementById('gajiNamaInput').value,
        periode: isEdit ? g.periode : (bulanVal ? bulanVal + '-' + pnumVal : ''),
        durasiKerja: document.getElementById('gajiDurasiInput').value,
        gajiPokok: document.getElementById('gajiPokokInput').value,
        pinalti: document.getElementById('gajiPinaltiInput').value,
        kompensasi: document.getElementById('gajiKompensasiInput').value,
        bonus: document.getElementById('gajiBonusInput').value
      };
      if (!data.nama) { msgEl.textContent = 'Pilih nama mitra dulu.'; return; }
      if (!data.periode) { msgEl.textContent = 'Pilih periode dulu.'; return; }

      callApi('tambahGaji', [TOKEN, data])
        .then(function(res) {
          if (res.success) {
            closeMitraModal();
            showToast(res.message, 'success');
            loadGaji();
          } else {
            msgEl.textContent = res.message;
          }
        }).catch(function(err) { msgEl.textContent = 'Gagal: ' + err.message; });

    function confirmDeleteGaji(id, nama, periodeLabel) {

      callApi('hapusGaji', [TOKEN, id])
        .then(function(res) {
          if (!res.success) { showToast(res.message, 'error'); return; }
          gajiCache = gajiCache.filter(g => g.id !== id);
          renderGajiTab();
          showToast('Data gaji berhasil dihapus.', 'success');
        })
        .catch(function(err) { showToast('Gagal menghapus: ' + err.message, 'error'); });

    // ---------- UPLOAD CSV MASSAL (GAJI) ----------

    function downloadGajiTemplateXlsx() {
      const header = ['Nama Mitra', 'Periode', 'Durasi Kerja (Jam)', 'Gaji Pokok', 'Pinalti', 'Kompensasi', 'Bonus'];
      const example = ['Siti Aminah', currentPeriodeDefault_(), 176, 3500000, 0, 0, 200000];
      const ws = XLSX.utils.aoa_to_sheet([header, example]);

      // Kolom Periode (B) dipaksa format Text biar "2026-09" gak ke-auto-convert
      // jadi tanggal beneran sama Excel/Numbers (sumber masalah CSV kemarin).
      for (let r = 2; r <= 200; r++) {
        const addr = 'B' + r;
        if (!ws[addr]) ws[addr] = { t: 's', v: '' };
        ws[addr].z = '@';
      }
      ws['!cols'] = [{ wch: 20 }, { wch: 12 }, { wch: 16 }, { wch: 13 }, { wch: 11 }, { wch: 13 }, { wch: 11 }];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Gaji Mitra');
      XLSX.writeFile(wb, 'template-gaji-mitra.xlsx');
    }

    function openGajiImportModal() {
      const box = document.getElementById('mitraModalBox');
      box.innerHTML = `
        <h2>Upload Gaji Massal</h2>
        <p class="modal-sub">Kolom: Nama Mitra, Periode (format YYYY-MM-P1 atau YYYY-MM-P2, cth 2026-09-P1 buat Periode 1 September, atau 2026-09-P2 buat Periode 2 yang mulai 26 September), Durasi Kerja (Jam), Gaji Pokok, Pinalti, Kompensasi, Bonus. Kalau kombinasi nama + periode udah pernah diinput sebelumnya, datanya akan DITIMPA (update), bukan dobel.</p>
        <button type="button" class="btn-outline" style="width:auto;margin-bottom:14px;" onclick="downloadGajiTemplateXlsx()">⬇ Download Template (Excel)</button>
        <div class="dropzone" id="gajiCsvDropzone" onclick="document.getElementById('gajiCsvFileInput').click()">
          Klik untuk pilih file .xlsx atau .csv, atau drag &amp; drop di sini
        </div>
        <input type="file" id="gajiCsvFileInput" accept=".csv,.xlsx,.xls" style="display:none;" onchange="handleGajiCsvFileSelected(event)">
        <div id="gajiCsvPreviewArea"></div>
        <div class="modal-msg" id="gajiImportModalMsg"></div>
        <div class="modal-actions">

          <button class="btn-primary" style="margin-top:0;display:none;" id="gajiImportConfirmBtn" onclick="confirmImportGajiCsv()">Import Sekarang</button>

      `;
      document.getElementById('mitraModalOverlay').style.display = 'flex';
      window.parsedGajiCsvRows = [];

      const dz = document.getElementById('gajiCsvDropzone');
      dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.style.borderColor = 'var(--magenta-500)'; });
      dz.addEventListener('dragleave', function() { dz.style.borderColor = ''; });
      dz.addEventListener('drop', function(e) {
        e.preventDefault();
        dz.style.borderColor = '';
        if (e.dataTransfer.files && e.dataTransfer.files[0]) readGajiCsvFile(e.dataTransfer.files[0]);

    function handleGajiCsvFileSelected(e) {
      const file = e.target.files[0];
      if (file) readGajiCsvFile(file);
    }

    function readGajiCsvFile(file) {
      const isExcel = /\.(xlsx|xls)$/i.test(file.name);
      if (isExcel) {
        const reader = new FileReader();
        reader.onload = function() {
          try {
            const wb = XLSX.read(new Uint8Array(reader.result), { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            // raw:false -> ambil nilai yang DITAMPILKAN di cell (string), bukan
            // angka serial mentah -- penting buat kolom Periode biar gak kebaca
            // sebagai serial number tanggal kalau Excel sempet nge-format ulang.
            const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
            const dataLines = rows.slice(1).filter(function(r) { return r.some(function(c) { return String(c).trim() !== ''; }); });
            const cellRows = dataLines.map(function(r) { return r.map(function(c) { return String(c).trim(); }); });
            buildGajiPreviewFromCells_(cellRows);
          } catch (err) {
            document.getElementById('gajiImportModalMsg').textContent = 'Gagal baca file Excel: ' + err.message;
          }
        };
        reader.readAsArrayBuffer(file);
      } else {
        const reader = new FileReader();
        reader.onload = function() { parseAndPreviewGajiCsv(reader.result); };
        reader.readAsText(file);
      }
    }

    function validateGajiCsvRowClient_(data) {
      if (!data.nama) return 'Nama Mitra kosong.';
      if (gajiMitraNames_.length && gajiMitraNames_.indexOf(data.nama) === -1) return 'Nama mitra tidak terdaftar di Data Mitra.';
      if (!/^\d{4}-\d{2}-P[12]$/.test(data.periode)) return 'Periode harus format YYYY-MM-P1 atau YYYY-MM-P2 (cth 2026-09-P1).';
      const numFields = ['durasiKerja', 'gajiPokok', 'pinalti', 'kompensasi', 'bonus'];
      for (const f of numFields) {
        if (data[f] !== '' && isNaN(Number(data[f]))) return 'Nilai "' + f + '" harus angka.';
        if (Number(data[f]) < 0) return 'Nilai tidak boleh negatif.';
      }
      return null;
    }

    function parseAndPreviewGajiCsv(text) {
      const lines = text.split(/\r\n|\n|\r/).filter(function(l) { return l.trim().length > 0; });
      if (lines.length < 2) {
        document.getElementById('gajiImportModalMsg').textContent = 'File kosong atau cuma ada baris header.';
        return;
      }
      const dataLines = lines.slice(1); // baris pertama = header, di-skip
      const cellRows = dataLines.map(function(line) { return parseCsvLine_(line); });
      buildGajiPreviewFromCells_(cellRows);
    }

    // Dipakai bareng sama parser CSV dan Excel -- keduanya berujung jadi
    // array of array (baris x kolom), baru di sini di-mapping ke objek data.
    // Bersihin karakter non-angka (pemisah ribuan, "Rp", spasi) yang mungkin
    // ikut kebawa kalau kolom angka diformat khusus di Excel.
    function cleanNumStr_(s) {
      const cleaned = String(s == null ? '' : s).replace(/[^\d.\-]/g, '');
      return cleaned === '' ? '0' : cleaned;
    }

    function buildGajiPreviewFromCells_(cellRows) {
      if (!cellRows.length) {
        document.getElementById('gajiImportModalMsg').textContent = 'File kosong atau cuma ada baris header.';
        return;
      }
      const parsed = cellRows.map(function(cells) {
        return {
          nama: cells[0] || '',
          periode: (cells[1] || '').trim(),
          durasiKerja: cleanNumStr_(cells[2]),
          gajiPokok: cleanNumStr_(cells[3]),
          pinalti: cleanNumStr_(cells[4]),
          kompensasi: cleanNumStr_(cells[5]),
          bonus: cleanNumStr_(cells[6])
        };
      });

      window.parsedGajiCsvRows = parsed.map(function(data) {
        return { data: data, error: validateGajiCsvRowClient_(data) };
      });
      document.getElementById('gajiImportModalMsg').textContent = '';
      renderGajiCsvPreview();
    }

    function renderGajiCsvPreview() {
      const area = document.getElementById('gajiCsvPreviewArea');
      const rows = window.parsedGajiCsvRows;
      const validCount = rows.filter(function(r) { return !r.error; }).length;

      const rowsHtml = rows.map(function(r, idx) {
        const total = r.error ? '-' : fmtRupiahJs_(Number(r.data.gajiPokok) - Number(r.data.pinalti) + Number(r.data.kompensasi) + Number(r.data.bonus));
        return `<tr class="${r.error ? 'row-invalid' : ''}">
          <td>${idx + 1}</td>
          <td>${escapeAttr(r.data.nama) || '-'}</td>
          <td>${escapeAttr(r.data.periode) || '-'}</td>
          <td>${total}</td>
          <td>${r.error ? escapeAttr(r.error) : 'OK'}</td>
        </tr>`;
      }).join('');

      area.innerHTML = `
        <div class="field-hint" style="margin:12px 0 6px;">${validCount} dari ${rows.length} baris valid dan siap diimport.</div>
        <div class="import-preview-table">
          <table>
            <tr><th>#</th><th>Nama</th><th>Periode</th><th>Gaji Total</th><th>Status</th></tr>
            ${rowsHtml}
          </table>
        </div>
      `;

      document.getElementById('gajiImportConfirmBtn').style.display = validCount ? 'block' : 'none';
    }

    function confirmImportGajiCsv() {
      const validRows = window.parsedGajiCsvRows.filter(function(r) { return !r.error; }).map(function(r) { return r.data; });
      if (!validRows.length) return;

      const btn = document.getElementById('gajiImportConfirmBtn');
      btn.disabled = true;
      btn.textContent = 'Mengimport...';

      callApi('importGajiBulk', [TOKEN, validRows])
        .then(function(res) {
          btn.disabled = false;
          btn.textContent = 'Import Sekarang';
          if (!res.success) {
            document.getElementById('gajiImportModalMsg').textContent = res.message;
            return;
          }
          if (res.failed && res.failed.length) {
            document.getElementById('gajiImportModalMsg').innerHTML =
              escapeAttr(res.message) + '<br><br>Detail baris gagal:<br>' +
              res.failed.map(function(f) { return '#' + f.row + ' ' + escapeAttr(f.nama || '') + ': ' + escapeAttr(f.message); }).join('<br>');
            loadGaji();
          } else {
            closeMitraModal();
            loadGaji();
            showToast(res.message, 'success');
          }
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = 'Import Sekarang';
          document.getElementById('gajiImportModalMsg').textContent = 'Gagal import: ' + err.message;
        });
    }

    function renderKotaCheckboxes(kategori, selectedKota) {
      const panel = document.getElementById('mKotaPanel');

        return;

      const allowed = kategoriWilayahMap[kategori];
      panel.innerHTML = allowed.map(kota => {
        const checked = selectedKota && selectedKota.indexOf(kota) !== -1;
        return `<label class="dropdown-check-row">
          <input type="checkbox" value="${kota}" ${checked ? 'checked' : ''} onchange="onKotaCheckboxChange(this)"> ${kota}
        </label>`;

    function setKotaLabel(text, isPlaceholder) {
      const labelEl = document.getElementById('mKotaLabel');
      labelEl.textContent = text;
      labelEl.classList.toggle('placeholder-text', !!isPlaceholder);
    }

    function updateKotaLabel() {
      const checked = Array.from(document.querySelectorAll('#mKotaPanel input:checked')).map(el => el.value);
      if (!checked.length) { setKotaLabel('Pilih kota', true); return; }
      const joined = checked.join(', ');
      setKotaLabel(joined.length > 42 ? checked.length + ' kota dipilih' : joined, false);
    }

    function onKotaCheckboxChange(el) {
      updateKotaLabel();
      if (!el.checked) {
        // kota di-uncheck -> buang kecamatan kota itu dari pilihan
        const kecList = kotaKecamatanMap[el.value] || [];
        window.kecamatanTags = window.kecamatanTags.filter(k => kecList.indexOf(k) === -1);
      }
      renderKecamatanGroups();
    }

    function renderKecamatanGroups() {
      const container = document.getElementById('mKecamatanContainer');
      const selectedKota = Array.from(document.querySelectorAll('#mKotaPanel input:checked')).map(el => el.value);

      if (!selectedKota.length) {
        container.innerHTML = '<div class="field-hint">Pilih kota dulu buat munculin daftar kecamatannya.</div>';
        return;
      }

      container.innerHTML = selectedKota.map(kota => {
        const list = kotaKecamatanMap[kota] || [];
        const selectedCount = list.filter(k => window.kecamatanTags.indexOf(k) !== -1).length;
        const rows = list.map(kec => {
          const checked = window.kecamatanTags.indexOf(kec) !== -1;
          return `<label class="dropdown-check-row">
            <input type="checkbox" value="${escapeAttr(kec)}" data-kota="${escapeAttr(kota)}" ${checked ? 'checked' : ''} onchange="onKecamatanCheckboxChange(this)"> ${kec}
          </label>`;
        }).join('');

        return `<div class="kecamatan-dropdown">
          <button type="button" class="kecamatan-dropdown-btn" onclick="toggleKecamatanDropdown(this)">
            <span class="kota-name">${kota}</span>

            ${rows || '<div class="field-hint">Belum ada data kecamatan untuk kota ini.</div>'}
          </div>
        </div>`;
      }).join('');

    function toggleKecamatanDropdown(btn) {
      const panel = btn.nextElementSibling;
      const willOpen = panel.style.display === 'none';
      document.querySelectorAll('.kecamatan-dropdown-panel').forEach(p => { p.style.display = 'none'; });
      document.querySelectorAll('.kecamatan-dropdown-btn').forEach(b => b.classList.remove('open'));
      if (willOpen) {
        panel.style.display = 'block';
        btn.classList.add('open');
      }
    }

    // Tutup dropdown yang lagi kebuka (kota atau kecamatan) kalau klik di luar area dropdown-nya

      if (!e.target.closest('.kecamatan-dropdown')) {
        document.querySelectorAll('.kecamatan-dropdown-panel').forEach(p => { p.style.display = 'none'; });
        document.querySelectorAll('.kecamatan-dropdown-btn').forEach(b => b.classList.remove('open'));
      }
    });

    function onKecamatanCheckboxChange(el) {
      el.parentElement.classList.toggle('checked', el.checked);
      const idx = window.kecamatanTags.indexOf(el.value);
      if (el.checked && idx === -1) window.kecamatanTags.push(el.value);
      if (!el.checked && idx !== -1) window.kecamatanTags.splice(idx, 1);

      const kota = el.dataset.kota;
      const list = kotaKecamatanMap[kota] || [];
      const count = list.filter(k => window.kecamatanTags.indexOf(k) !== -1).length;
      const countEl = document.querySelector('.kecamatan-dropdown-count[data-kota-count="' + kota.replace(/"/g, '\\"') + '"]');

      }).join('');

    function saveMitraModal(id) {
      const nama = document.getElementById('mNama').value.trim();
      const telpon = document.getElementById('mTelpon').value.trim();
      const email = document.getElementById('mEmail').value.trim();
      const password = document.getElementById('mPassword').value;
      const kategori = document.getElementById('mKategori').value;
      const kota = Array.from(document.querySelectorAll('#mKotaPanel input:checked')).map(el => el.value);
      const kecamatan = window.kecamatanTags.slice();
      const hariLibur = Array.from(document.querySelectorAll('#mHariGroup input:checked')).map(el => el.value);
      const gender = document.getElementById('mGender').value;
      const msgEl = document.getElementById('mitraModalMsg');
      msgEl.textContent = '';

      if (!nama || !telpon || !email || !password || !kategori || !kota.length || !gender) {
        msgEl.textContent = 'Mohon lengkapi semua field wajib (Kecamatan boleh dikosongkan).';
        return;
      }

      const data = { nama, telpon, email, password, kategori, kota, kecamatan, hariLibur, gender };
      const btn = document.getElementById('mitraSaveBtn');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      function onDone(res) {
        btn.disabled = false;
        btn.textContent = id ? 'Simpan Perubahan' : 'Tambah Mitra';
        if (res.success) {
          applyMitraSaveLocally(id, data, res);
          closeMitraModal();
          showToast(id ? 'Data mitra berhasil diperbarui.' : 'Mitra baru berhasil ditambahkan.', 'success');
        } else {
          msgEl.textContent = res.message;
        }
      }
      function onFail(err) {
        btn.disabled = false;
        btn.textContent = id ? 'Simpan Perubahan' : 'Tambah Mitra';
        msgEl.textContent = 'Gagal menyimpan: ' + err.message;
      }

      const action = id ? 'updateDataMitra' : 'tambahDataMitra';
      const params = id ? [TOKEN, id, data] : [TOKEN, data];
      callApi(action, params).then(onDone).catch(onFail);
    }

    // ---------- MODAL TAMBAH MITRA BARU (onboarding) ----------
    // Reuse total komponen kota/kecamatan/hari libur dari modal Data Mitra
    // di atas (ID elemen sama persis: mKotaPanel, mKecamatanContainer,
    // mHariGroup, dst) -- cuma nambah field PIN + beda tombol & endpoint.

    function openMitraBaruModal() {
      const box = document.getElementById('mitraModalBox');
      const kategoriOptions = Object.keys(kategoriWilayahMap).map(k => `<option value="${k}">${k}</option>`).join('');

      box.innerHTML = `
        <h2>Tambah Mitra Baru</h2>
        <p class="modal-sub">Isi data calon mitra yang perlu dihubungi admin buat onboarding. Belum masuk Data Mitra/PIN Mitra sampai ditandai "Selesai".</p>

        <label>Nama Mitra</label>
        <input type="text" id="mNama" value="">

        <div class="row2">
          <div>
            <label>Nomor Telpon</label>
            <input type="text" id="mTelpon" value="" placeholder="08xxxxxxxxxx">
          </div>
          <div>
            <label>Email</label>
            <input type="email" id="mEmail" value="">
          </div>
        </div>

        <label>Password</label>
        <div class="password-field">
          <input type="password" id="mPassword" value="">
          <button type="button" class="password-toggle" onclick="togglePasswordVisibility()">👁️</button>
        </div>
        <div class="field-hint">Dipakai mitra buat login ke aplikasi/portal mereka nantinya.</div>

        <label>PIN (4 digit)</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="mbPin" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="cth: 1234" style="flex:1;">
          <button type="button" class="btn-outline" style="margin-top:0;white-space:nowrap;" onclick="document.getElementById('mbPin').value = randomPin_();">Acak</button>
        </div>
        <div class="field-hint">Dipakai mitra buat submit izin, cek riwayat, & cek gaji nantinya.</div>

        <label>Kategori Layanan</label>
        <select id="mKategori" onchange="onKategoriModalChange()">
          <option value="">Pilih kategori</option>
          ${kategoriOptions}
        </select>

        <label>Kota</label>
        <div class="kecamatan-dropdown" id="mKotaDropdownWrap">
          <button type="button" class="kecamatan-dropdown-btn" onclick="toggleKecamatanDropdown(this)">
            <span class="kota-select-label placeholder-text" id="mKotaLabel">Pilih kategori dulu</span>
            <svg class="chevron" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="kecamatan-dropdown-panel" id="mKotaPanel" style="display:none;"></div>
        </div>

        <label>Kecamatan</label>
        <div id="mKecamatanContainer"></div>
        <div class="field-hint">Kecamatan otomatis muncul sesuai kota yang dipilih di atas.</div>

        <label>Hari Libur</label>
        <div class="checkbox-grid" id="mHariGroup"></div>

        <label>Gender</label>
        <select id="mGender">
          <option value="">Pilih gender</option>
          <option value="Laki-laki">Laki-laki</option>
          <option value="Perempuan">Perempuan</option>
        </select>

        <div class="modal-msg" id="mitraModalMsg"></div>
        <div class="modal-actions">
          <button class="btn-secondary" style="flex:1;" onclick="closeMitraModal()">Batal</button>
          <button class="btn-primary" style="margin-top:0;" id="mitraSaveBtn" onclick="saveMitraBaruModal()">Tambah ke Mitra Baru</button>
        </div>
      `;

      document.getElementById('mitraModalOverlay').style.display = 'flex';
      window.kecamatanTags = [];
      renderKotaCheckboxes('', []);
      renderHariCheckboxes([]);
      renderKecamatanGroups();
    }

    function saveMitraBaruModal() {
      const nama = document.getElementById('mNama').value.trim();
      const telpon = document.getElementById('mTelpon').value.trim();
      const email = document.getElementById('mEmail').value.trim();
      const password = document.getElementById('mPassword').value;
      const pin = document.getElementById('mbPin').value.trim();
      const kategori = document.getElementById('mKategori').value;
      const kota = Array.from(document.querySelectorAll('#mKotaPanel input:checked')).map(el => el.value);
      const kecamatan = window.kecamatanTags.slice();
      const hariLibur = Array.from(document.querySelectorAll('#mHariGroup input:checked')).map(el => el.value);
      const gender = document.getElementById('mGender').value;
      const msgEl = document.getElementById('mitraModalMsg');
      msgEl.textContent = '';

      if (!nama || !telpon || !email || !password || !kategori || !kota.length || !gender) {
        msgEl.textContent = 'Mohon lengkapi semua field wajib (Kecamatan boleh dikosongkan).';
        return;
      }
      if (!/^[0-9]{4}$/.test(pin)) {
        msgEl.textContent = 'PIN harus 4 digit angka.';
        return;
      }

      const data = { nama, telpon, email, password, pin, kategori, kota, kecamatan, hariLibur, gender };
      const btn = document.getElementById('mitraSaveBtn');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';

      callApi('tambahMitraBaru', [TOKEN, data])
        .then(function(res) {
          btn.disabled = false;
          btn.textContent = 'Tambah ke Mitra Baru';
          if (res.success) {
            closeMitraModal();
            showToast(res.message, 'success');
            loadMitraBaru();
          } else {
            msgEl.textContent = res.message;
          }
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = 'Tambah ke Mitra Baru';
          msgEl.textContent = 'Gagal menyimpan: ' + err.message;
        });
    }

    // Simpen di sisi server udah beres (ini dipanggil abis res.success true),
    // jadi tinggal update cache lokal pake data yang emang udah kita punya --
    // gak perlu fetch ulang ke server, jadi gak bisa macet gara-gara hiccup
    // jaringan pas reload kayak yang kemarin kejadian.
    function applyMitraSaveLocally(id, data, res) {
      if (id) {
        const idx = dataMitraCache.findIndex(m => m.id === id);
        if (idx !== -1) dataMitraCache[idx] = Object.assign({}, dataMitraCache[idx], data);
      } else {
        dataMitraCache.push(Object.assign({ id: res.id, tanggalDitambahkan: new Date() }, data));
      }
      dataMitraCache.sort((a, b) => a.nama.localeCompare(b.nama, 'id', { sensitivity: 'base' }));
      renderDataMitraTab();
    }

    function confirmDeleteMitra(id, nama) {
      if (!confirm('Hapus data mitra "' + nama + '"? Tindakan ini tidak bisa dibatalkan.')) return;
      callApi('hapusDataMitra', [TOKEN, id])
        .then(function(res) {
          if (res.success) {
            dataMitraCache = dataMitraCache.filter(m => m.id !== id);
            renderDataMitraTab();
            showToast('Data mitra berhasil dihapus.', 'success');
          } else {
            showToast(res.message, 'error');
          }
        })
        .catch(function(err) { showToast('Gagal menghapus: ' + err.message, 'error'); });
    }

    // ---------- UPLOAD CSV MASSAL ----------

    function downloadTemplateCsv() {
      const header = 'Nama Mitra,Nomor Telpon,Email,Password,Kategori,Kota,Kecamatan,Hari Libur,Gender';
      const example = 'Siti Aminah,081234567890,siti@example.com,rahasia123,Daily Cleaning,Surabaya;Bandung,Genteng;Coblong,Minggu,Perempuan';
      const csv = header + '\n' + example + '\n';
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'template-data-mitra.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function openImportModal() {
      const box = document.getElementById('mitraModalBox');
      box.innerHTML = `
        <h2>Upload Data Mitra (CSV)</h2>
        <p class="modal-sub">Kolom: Nama Mitra, Nomor Telpon, Email, Password, Kategori, Kota, Kecamatan, Hari Libur, Gender. Kalau kota/kecamatan/hari libur lebih dari satu, pisahkan pakai titik koma ( ; ) di dalam satu kolom.</p>
        <button type="button" class="btn-outline" style="width:auto;margin-bottom:14px;" onclick="downloadTemplateCsv()">⬇ Download Template CSV</button>
        <div class="dropzone" id="csvDropzone" onclick="document.getElementById('csvFileInput').click()">
          Klik untuk pilih file .csv, atau drag &amp; drop di sini
        </div>
        <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="handleCsvFileSelected(event)">
        <div id="csvPreviewArea"></div>
        <div class="modal-msg" id="importModalMsg"></div>
        <div class="modal-actions">
          <button class="btn-secondary" style="flex:1;" onclick="closeMitraModal()">Batal</button>
          <button class="btn-primary" style="margin-top:0;display:none;" id="importConfirmBtn" onclick="confirmImportCsv()">Import Sekarang</button>
        </div>
      `;
      document.getElementById('mitraModalOverlay').style.display = 'flex';
      window.parsedCsvRows = [];

      const dz = document.getElementById('csvDropzone');
      dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.style.borderColor = 'var(--magenta-500)'; });
      dz.addEventListener('dragleave', function() { dz.style.borderColor = ''; });
      dz.addEventListener('drop', function(e) {
        e.preventDefault();
        dz.style.borderColor = '';
        if (e.dataTransfer.files && e.dataTransfer.files[0]) readCsvFile(e.dataTransfer.files[0]);
      });
    }

    function handleCsvFileSelected(e) {
      const file = e.target.files[0];
      if (file) readCsvFile(file);
    }

    function readCsvFile(file) {
      const reader = new FileReader();
      reader.onload = function() { parseAndPreviewCsv(reader.result); };
      reader.readAsText(file);
    }

    function parseCsvLine_(line) {
      return line.split(',').map(function(cell) {
        let c = cell.trim();
        if (c.length > 1 && c.charAt(0) === '"' && c.charAt(c.length - 1) === '"') c = c.slice(1, -1);
        return c;
      });
    }

    function validateCsvRowClient_(data) {
      if (!data.nama) return 'Nama Mitra kosong.';
      if (!data.telpon) return 'Nomor Telpon kosong.';
      if (!data.email) return 'Email kosong.';
      if (!data.password) return 'Password kosong.';
      if (!kategoriWilayahMap[data.kategori]) return 'Kategori "' + data.kategori + '" tidak dikenal.';
      const allowed = kategoriWilayahMap[data.kategori];
      const validKota = data.kota.filter(function(k) { return allowed.indexOf(k) !== -1; });
      if (!validKota.length) return 'Kota tidak sesuai kategori (harus salah satu: ' + allowed.join(', ') + ').';
      if (data.gender !== 'Laki-laki' && data.gender !== 'Perempuan') return 'Gender harus "Laki-laki" atau "Perempuan".';
      return null;
    }

    function parseAndPreviewCsv(text) {
      const lines = text.split(/\r\n|\n|\r/).filter(function(l) { return l.trim().length > 0; });
      if (lines.length < 2) {
        document.getElementById('importModalMsg').textContent = 'File kosong atau cuma ada baris header.';
        return;
      }
      const dataLines = lines.slice(1); // baris pertama = header, di-skip
      const parsed = dataLines.map(function(line) {
        const cells = parseCsvLine_(line);
        return {
          nama: cells[0] || '',
          telpon: cells[1] || '',
          email: cells[2] || '',
          password: cells[3] || '',
          kategori: cells[4] || '',
          kota: (cells[5] || '').split(';').map(function(s) { return s.trim(); }).filter(Boolean),
          kecamatan: (cells[6] || '').split(';').map(function(s) { return s.trim(); }).filter(Boolean),
          hariLibur: (cells[7] || '').split(';').map(function(s) { return s.trim(); }).filter(Boolean),
          gender: cells[8] || ''
        };
      });

      window.parsedCsvRows = parsed.map(function(data) {
        return { data: data, error: validateCsvRowClient_(data) };
      });
      renderCsvPreview();
    }

    function renderCsvPreview() {
      const area = document.getElementById('csvPreviewArea');
      const rows = window.parsedCsvRows;
      const validCount = rows.filter(function(r) { return !r.error; }).length;

      const rowsHtml = rows.map(function(r, idx) {
        return `<tr class="${r.error ? 'row-invalid' : ''}">
          <td>${idx + 1}</td>
          <td>${escapeAttr(r.data.nama) || '-'}</td>
          <td>${escapeAttr(r.data.kategori) || '-'}</td>
          <td>${r.error ? escapeAttr(r.error) : 'OK'}</td>
        </tr>`;
      }).join('');

      area.innerHTML = `
        <div class="field-hint" style="margin:12px 0 6px;">${validCount} dari ${rows.length} baris valid dan siap diimport.</div>
        <div class="import-preview-table">
          <table>
            <tr><th>#</th><th>Nama</th><th>Kategori</th><th>Status</th></tr>
            ${rowsHtml}
          </table>
        </div>
      `;

      document.getElementById('importConfirmBtn').style.display = validCount ? 'block' : 'none';
    }

    function confirmImportCsv() {
      const validRows = window.parsedCsvRows.filter(function(r) { return !r.error; }).map(function(r) { return r.data; });
      if (!validRows.length) return;

      const btn = document.getElementById('importConfirmBtn');
      btn.disabled = true;
      btn.textContent = 'Mengimport...';

      callApi('importDataMitraBulk', [TOKEN, validRows])
        .then(function(res) {
          btn.disabled = false;
          btn.textContent = 'Import Sekarang';
          if (!res.success) {
            document.getElementById('importModalMsg').textContent = res.message;
            return;
          }
          if (res.failed && res.failed.length) {
            document.getElementById('importModalMsg').innerHTML =
              escapeAttr(res.message) + '<br><br>Detail baris gagal:<br>' +
              res.failed.map(function(f) { return '#' + f.row + ' ' + escapeAttr(f.nama || '') + ': ' + escapeAttr(f.message); }).join('<br>');
            loadDataMitra();
          } else {
            closeMitraModal();
            loadDataMitra();
            showToast(res.message, 'success');
          }
        })
        .catch(function(err) {
          btn.disabled = false;
          btn.textContent = 'Import Sekarang';
          document.getElementById('importModalMsg').textContent = 'Gagal import: ' + err.message;
        });
    }

    // Coba pulihkan sesi login begitu halaman ini dibuka/di-refresh.
    tryRestoreSession();
  </script>
</body>
</html>
